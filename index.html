<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Slider</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Image slider</h1>
<section class="slider" aria-roledescription="carousel" aria-label="Scenery slider" tabindex="0">
<div class="track" id="track">
<figure><img src="images/sunrise.svg" alt="Sunrise over hills"><figcaption>Sunrise</figcaption></figure>
<figure><img src="images/mountains.svg" alt="Snow-capped mountains"><figcaption>Mountains</figcaption></figure>
<figure><img src="images/ocean.svg" alt="Calm ocean waves"><figcaption>Ocean</figcaption></figure>
<figure><img src="images/night-city.svg" alt="City skyline at night"><figcaption>Night city</figcaption></figure>
<figure><img src="images/forest.svg" alt="Green pine forest"><figcaption>Forest</figcaption></figure></div>
<button id="prev" class="nav prev" aria-label="Previous slide">&#10094;</button><button id="next" class="nav next" aria-label="Next slide">&#10095;</button>
<div id="dots" class="dots"></div></section>
<p class="hint">Use the arrows, dots, keyboard arrow keys, or swipe. Autoplay pauses on hover.</p></main><script src="script.js"></script></body></html>
